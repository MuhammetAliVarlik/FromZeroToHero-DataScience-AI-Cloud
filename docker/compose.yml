# Local services for the course. Everything here is free and runs on your machine.
#
# Start only what a module needs (each module README lists its services):
#   docker compose -f docker/compose.yml --profile db up -d          # PostgreSQL + pgvector, MongoDB, Redis
#   docker compose -f docker/compose.yml --profile ollama up -d      # Ollama in Docker (skip if Ollama is installed natively:
#                                                                     #  the course talks to http://localhost:11434 either way)
#   docker compose -f docker/compose.yml --profile streaming up -d   # Kafka + RustFS (S3) + Schema Registry
#   docker compose -f docker/compose.yml --profile cdc up -d         # Debezium (Kafka Connect) for change data capture
#   docker compose -f docker/compose.yml --profile flink up -d       # Apache Flink (JobManager, TaskManager, SQL Gateway)
#   docker compose -f docker/compose.yml --profile lakehouse up -d   # RustFS (S3) + Iceberg REST catalog
#   docker compose -f docker/compose.yml --profile lineage up -d     # Marquez (OpenLineage server)
#   docker compose -f docker/compose.yml --profile cloud up -d       # LocalStack (AWS emulator) + RustFS (S3)
#   docker compose -f docker/compose.yml --profile observability up -d   # Prometheus + Grafana
#   docker compose -f docker/compose.yml --profile graph up -d       # Neo4j
#   docker compose -f docker/compose.yml --profile vector up -d      # Qdrant
#   docker compose -f docker/compose.yml --profile bi up -d          # Apache Superset (+ PostgreSQL as a data source)
#   docker compose -f docker/compose.yml --profile orchestration up -d   # Apache Airflow 3 (standalone, http://localhost:8080)
# Stop:   docker compose -f docker/compose.yml --profile <name> down
# Reset data (deletes volumes):  docker compose -f docker/compose.yml --profile <name> down -v
#
# Default credentials are for local learning only. Never reuse them anywhere else.

name: fromzerotohero

services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [db, rag, bi, orchestration, cdc, lineage]
    command: ["postgres", "-c", "wal_level=logical"]     # logical decoding for change data capture (Debezium, M12)
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course"]
      interval: 5s
      retries: 10

  superset:
    build: ./superset                 # apache/superset:5.0.0 + PostgreSQL driver (see docker/superset/Dockerfile)
    image: fromzerotohero-superset:5.0.0
    profiles: [bi]
    depends_on: [postgres]
    environment:
      SUPERSET_SECRET_KEY: local-learning-only-change-me-0123456789abcdef
      SUPERSET_LOAD_EXAMPLES: "no"
    ports: ["8088:8088"]
    volumes: [superset-home:/app/superset_home]
    # one-time setup (idempotent): metadata database, admin user, roles; then start the web server
    command:
      - bash
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Course --lastname Admin --email admin@example.com --password admin || true) &&
        superset init &&
        /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 30

  airflow:
    image: apache/airflow:3.1.0
    profiles: [orchestration]
    depends_on:
      postgres: {condition: service_healthy}
    # create the metadata database in the course PostgreSQL (SQLite cannot handle parallel tasks), then start
    # scheduler + API server + DAG processor + triggerer in one container (standalone mode, local learning)
    command:
      - bash
      - -c
      - >-
        python -c "import psycopg2;
        c = psycopg2.connect(host='postgres', user='course', password='course', dbname='course'); c.autocommit = True;
        cur = c.cursor(); cur.execute(\"SELECT 1 FROM pg_database WHERE datname = 'airflow'\");
        cur.fetchone() or cur.execute('CREATE DATABASE airflow')" &&
        airflow standalone
    environment:
      CONNECTION_CHECK_MAX_COUNT: "0"     # skip the entrypoint's DB check: the command creates the database first
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://course:course@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # no login for local learning only
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"          # pick up new DAG files quickly
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb==1.5.6"            # same version as the course venv; installed at start
    ports: ["8080:8080"]
    volumes:
      - ../data/cache/airflow/dags:/opt/airflow/dags          # notebooks write DAG files here
      - ../data/cache:/opt/airflow/course_data:ro            # course datasets (read-only)
      - ../data/cache/airflow/output:/opt/airflow/output     # task outputs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      retries: 60

  mongodb:
    image: mongo:8
    profiles: [db]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    profiles: [db, llm-app]
    ports: ["6379:6379"]

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    # GPU access. Remove this block if the NVIDIA Container Toolkit is not installed (Ollama then runs on CPU).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    profiles: [vector]
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  kafka:
    image: apache/kafka:3.9.1
    profiles: [streaming, cdc, flink]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for the notebooks on the host, INTERNAL for other containers (Debezium, Flink, Schema Registry)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0    # new consumer groups start at once (default waits 3 s for members)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    profiles: [streaming]
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 5s
      retries: 30

  connect:                               # Debezium = Kafka Connect + CDC source connectors
    image: quay.io/debezium/connect:3.3
    profiles: [cdc]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: course-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      OFFSET_FLUSH_INTERVAL_MS: 5000     # commit source offsets every 5 s (default 60 s); Debezium then confirms the WAL position
      HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      retries: 40

  flink-jobmanager:
    build: ./flink
    image: fromzerotohero-flink:1.20.1
    profiles: [flink]
    command: jobmanager
    ports: ["8082:8081"]                 # Flink web UI on http://localhost:8082 (8081 is the Schema Registry)
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        rest.address: flink-jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview > /dev/null"]
      interval: 5s
      retries: 30

  flink-taskmanager:
    image: fromzerotohero-flink:1.20.1
    profiles: [flink]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1024m

  flink-sql-gateway:                     # REST API for Flink SQL; the notebooks send statements here
    image: fromzerotohero-flink:1.20.1
    profiles: [flink]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    command: ["bin/sql-gateway.sh", "start-foreground", "-Dsql-gateway.endpoint.rest.address=0.0.0.0",
              "-Drest.address=flink-jobmanager", "-Djobmanager.rpc.address=flink-jobmanager"]
    ports: ["8084:8083"]                 # SQL Gateway REST on http://localhost:8084
    environment:
      FLINK_ENV_JAVA_OPTS: "-Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/v1/info > /dev/null"]
      interval: 5s
      retries: 30

  rustfs:                                # S3-compatible object storage (Apache-2.0; replaces MinIO, which stopped
    image: rustfs/rustfs:1.0.4           # publishing images). API on :9000, web console on :9001
    profiles: [streaming, cloud, lakehouse]
    environment:
      RUSTFS_ACCESS_KEY: course
      RUSTFS_SECRET_KEY: course-password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_DURABILITY_MODE: none       # no fsync per write: Docker Desktop disks make each sync ~1-2 s (local course data only)
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfs-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health > /dev/null"]
      interval: 5s
      retries: 20

  iceberg-rest:                          # Apache Iceberg REST catalog (reference server), tables stored in RustFS
    image: apache/iceberg-rest-fixture:1.9.0
    profiles: [lakehouse]
    depends_on:
      rustfs: {condition: service_healthy}
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: course
      AWS_SECRET_ACCESS_KEY: course-password
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_catalog.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password

  marquez:                               # OpenLineage server: stores lineage events, serves the lineage graph
    image: marquezproject/marquez:0.50.0
    profiles: [lineage]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["5000:5000", "5001:5001"]
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres            # database, user and password are "marquez" (image's marquez.dev.yml);
      POSTGRES_PORT: 5432                # M12 L07 creates them in the course PostgreSQL
      JAVA_OPTS: "-Xmx384m"

  localstack:
    image: localstack/localstack:4
    profiles: [cloud]
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,sqs,lambda,iam,sts,events,dynamodb
    volumes: [/var/run/docker.sock:/var/run/docker.sock]

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports: ["9090:9090"]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: course
      GF_SECURITY_ADMIN_PASSWORD: course
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes: [grafana-data:/var/lib/grafana]

  neo4j:
    image: neo4j:5-community
    profiles: [graph]
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/course-password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes: [neo4j-data:/data]

volumes:
  postgres-data:
  superset-home:
  mongo-data:
  ollama-models:
  qdrant-data:
  rustfs-data:
  grafana-data:
  neo4j-data:
