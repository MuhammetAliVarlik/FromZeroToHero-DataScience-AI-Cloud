    "shap>=0.46",
    "lime>=0.2",
    "fairlearn>=0.12",
    "interpret>=0.6",
    "captum>=0.7",
    "opacus>=1.5",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# M38 GPU programming (needs an NVIDIA GPU)
gpu = [
    "cupy-cuda12x>=13.3",
    "numba>=0.60",
]

[tool.uv]
# Install all groups together only when you ask for them.
default-groups = []

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
