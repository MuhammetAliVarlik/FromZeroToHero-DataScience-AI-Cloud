# Single source of truth for the course structure.
# Edit this file, then run: python tools/build_curriculum.py --check --generate
version: 1
title: 'FromZeroToHero: Data Science, AI & Cloud'
reference_hardware:
  gpu: NVIDIA GeForce GTX 1650 Ti
  vram_gib: 4
  compute_capability: 7.5
  ram_gib: 8
  note: Every lesson must run on this machine or on free tiers. Lessons that need newer GPUs explain the concept, run what
    the hardware allows, and state the requirement at the top.
core_modules:
  - M01
  - M03
  - M04
statuses:
  done: rewritten, executed and verified
  review: content exists; audit pending in Phase B
  deepen: too thin; needs more explanation and hands-on code
  realise: outputs came from a simulation/mock; re-run for real with free tools
  merge: duplicate of another lesson; merge into the canonical one
  rewrite: broken or wrong content; rewrite
  planned: new lesson, not written yet
