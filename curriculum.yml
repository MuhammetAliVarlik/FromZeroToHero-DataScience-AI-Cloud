      - M43
    summary: 'Embeds with customers to turn an AI product into a working solution: discovery, data integration, prototyping,
      deployment.'
  - id: ai-engineer
    name: AI Engineer
    paths:
      - software-engineer
      - ai-app-engineer
    extra_modules: []
    summary: 'Builds LLM-powered products: RAG, agents, tools/MCP, evaluation and production APIs.'
  - id: ml-engineer
    name: Machine Learning Engineer
    paths:
      - ml-engineer
    extra_modules: []
    summary: Trains, optimises and ships classical and deep learning models into production.
  - id: applied-scientist
    name: Applied Scientist / Research Engineer
    paths:
      - data-scientist
      - deep-learning-cv
      - nlp-llm
    extra_modules: []
    summary: Designs and evaluates new models and methods; strong statistics and deep learning.
  - id: product-data-scientist
    name: Product Data Scientist
    paths:
      - data-analyst
      - data-scientist
    extra_modules: []
    summary: Drives product decisions with experiments, causal inference and modelling.
  - id: analytics-engineer
    name: Analytics Engineer
    paths:
      - data-analyst
    extra_modules:
      - M02
      - M11
    summary: Builds tested, documented data models (dbt) between raw data and BI.
  - id: data-engineer
    name: Data Engineer
    paths:
      - data-engineer
    extra_modules: []
    summary: Builds and operates batch and streaming pipelines, warehouses and lakehouses.
  - id: ai-platform-engineer
    name: MLOps / AI Platform Engineer
    paths:
      - mlops
    extra_modules:
      - M26
      - M36
    summary: Owns the platform for training, serving, monitoring and governing models, including LLMs.
  - id: inference-engineer
    name: Inference & Performance Engineer
    paths:
      - ai-infra-gpu
    extra_modules: []
    summary: 'Makes models fast and cheap: kernels, quantisation, serving engines, distributed systems.'
  - id: cv-engineer
    name: Computer Vision / Perception Engineer
    paths:
      - deep-learning-cv
      - edge-ai-rl
    extra_modules: []
    summary: Builds vision and multimodal systems, often deployed on edge devices or robots.
  - id: ai-security-engineer
    name: AI Security Engineer / Red Teamer
    paths:
      - responsible-ai
      - ai-app-engineer
    extra_modules: []
    summary: 'Attacks and defends AI systems: prompt injection, jailbreaks, data leakage, governance.'
  - id: ai-solutions-architect
    name: AI Solutions Architect
    paths:
      - ai-app-engineer
      - mlops
    extra_modules:
      - M43
    summary: Designs end-to-end AI architectures and guides customers or internal teams through adoption.
